{% load book_tags %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Книги{% endblock %} — {% site_name %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #aeaeb2;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: rgba(0,0,0,0.08);
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.10);
            --shadow-lg: 0 24px 64px rgba(0,0,0,0.12);
            --radius: 18px;
            --radius-sm: 12px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: sticky; top: 0; z-index: 200;
            background: rgba(255,255,255,0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
            height: 52px;
            display: flex; align-items: center;
            padding: 0 22px;
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-size: 1.05rem; font-weight: 700;
            color: var(--text-primary); text-decoration: none;
            display: flex; align-items: center; gap: 7px;
        }
        .nav-logo svg { width: 22px; height: 22px; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a {
            font-size: .88rem; color: var(--text-secondary);
            text-decoration: none; transition: color .2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 22px; }
        .hero {
            background: var(--bg-secondary);
            padding: 80px 22px 72px;
            text-align: center;
        }
        .hero-eyebrow {
            font-size: .78rem; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: var(--accent);
            margin-bottom: 14px;
        }
        .hero-title {
            font-size: clamp(2.4rem, 5vw, 4rem);
            font-weight: 800; letter-spacing: -.03em;
            color: var(--text-primary); line-height: 1.08;
            margin-bottom: 16px;
        }
        .hero-subtitle {
            font-size: 1.15rem; color: var(--text-secondary);
            font-weight: 400; max-width: 520px; margin: 0 auto;
        }

        .section { padding: 56px 22px; }
        .section-header {
            display: flex; align-items: baseline;
            justify-content: space-between; margin-bottom: 28px;
        }
        .section-title {
            font-size: 1.5rem; font-weight: 700;
            letter-spacing: -.02em; color: var(--text-primary);
        }
        .section-link {
            font-size: .88rem; color: var(--accent);
            text-decoration: none; font-weight: 500;
        }
        .section-link:hover { text-decoration: underline; }

  
        .chips {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-bottom: 36px;
        }
        .chip {
            padding: 7px 16px; border-radius: 100px;
            font-size: .82rem; font-weight: 500;
            text-decoration: none; transition: all .2s;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            background: var(--bg);
        }
        .chip:hover { border-color: var(--text-primary); color: var(--text-primary); }
        .chip.active {
            background: var(--text-primary);
            color: #fff; border-color: var(--text-primary);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px 20px;
        }

        .book-card { cursor: pointer; }
        .book-card-cover-wrap {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 3/4;
            margin-bottom: 14px;
            box-shadow: var(--shadow-md);
            transition: transform .35s cubic-bezier(.25,.46,.45,.94),
                        box-shadow .35s cubic-bezier(.25,.46,.45,.94);
        }
        .book-card:hover .book-card-cover-wrap {
            transform: scale(1.03) translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .book-card-cover {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem;
        }
        .book-card-badge {
            position: absolute; top: 10px; right: 10px;
        }
        .book-card-title {
            font-size: .92rem; font-weight: 600;
            color: var(--text-primary); line-height: 1.3;
            margin-bottom: 3px;
        }
        .book-card-author {
            font-size: .8rem; color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .book-card-price {
            font-size: .88rem; font-weight: 600; color: var(--accent);
        }
        .book-card-stars { font-size: .78rem; color: var(--text-tertiary); margin-bottom: 2px; }
        .stars { color: #ff9f0a; letter-spacing: 1px; }
        .rating-num { color: var(--text-tertiary); margin-left: 3px; }

        .badge {
            display: inline-block; padding: .22em .6em;
            border-radius: 6px; font-size: .72rem; font-weight: 600;
        }
        .badge-green  { background: rgba(52,199,89,.15); color: #1d7a3a; }
        .badge-red    { background: rgba(255,59,48,.12); color: #c0392b; }
        .badge-blue   { background: rgba(0,113,227,.12); color: #0055b3; }
        .badge-gray   { background: rgba(110,110,115,.12); color: #555; }
        .book-age { font-size: .78rem; color: var(--text-tertiary); }

        .featured {
            background: var(--bg-secondary);
            border-radius: 24px; overflow: hidden;
            display: grid; grid-template-columns: 1fr 1fr;
            min-height: 320px; margin-bottom: 56px;
        }
        .featured-body {
            padding: 48px 44px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .featured-eyebrow {
            font-size: .75rem; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
        }
        .featured-title {
            font-size: 2rem; font-weight: 800; letter-spacing: -.03em;
            color: var(--text-primary); margin-bottom: 10px; line-height: 1.1;
        }
        .featured-author { font-size: .95rem; color: var(--text-secondary); margin-bottom: 20px; }
        .featured-desc { font-size: .9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 22px; border-radius: 100px;
            font-size: .88rem; font-weight: 600;
            text-decoration: none; transition: all .2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: scale(1.02); }
        .btn-outline {
            background: transparent; color: var(--text-primary);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover { border-color: var(--text-primary); }
        .featured-cover-side {
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; padding: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,.6), transparent);
        }

        .detail-hero {
            background: var(--bg-secondary);
            padding: 64px 22px 56px;
        }
        .detail-hero-inner {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 220px 1fr; gap: 48px; align-items: start;
        }
        .detail-cover-wrap {
            border-radius: var(--radius);
            overflow: hidden; box-shadow: var(--shadow-lg);
            aspect-ratio: 3/4;
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem;
        }
        .detail-eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
        .detail-title { font-size: 2.4rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.08; margin-bottom: 8px; }
        .detail-author { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 16px; }
        .detail-meta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .detail-price-tag { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
        .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
        .detail-facts {
            display: flex; gap: 24px; flex-wrap: wrap;
            padding: 18px 0; border-top: 1px solid var(--border);
        }
        .detail-fact-item { display: flex; flex-direction: column; }
        .detail-fact-label { font-size: .72rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
        .detail-fact-value { font-size: .92rem; font-weight: 600; color: var(--text-primary); }

        .rating-bar-wrap { display: flex; align-items: center; gap: 10px; }
        .rating-bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .rating-bar-fill { height: 100%; background: #ff9f0a; border-radius: 2px; }
        .rating-bar-label { font-size: .82rem; font-weight: 600; min-width: 28px; }

        .genre-pill {
            display: inline-block; padding: .25em .75em;
            border-radius: 100px; font-size: .78rem; font-weight: 500;
            background: rgba(0,113,227,.1); color: var(--accent);
        }

        .reviews-section { padding: 48px 22px; border-top: 1px solid var(--border); }
        .review-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 20px 22px; margin-bottom: 12px;
        }
        .review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .reviewer { font-weight: 600; font-size: .9rem; }
        .review-date { font-size: .78rem; color: var(--text-tertiary); }
        .review-stars { color: #ff9f0a; font-size: .85rem; margin-bottom: 6px; }

        .author-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .author-card {
            background: var(--bg-secondary); border-radius: var(--radius-sm);
            padding: 24px 20px; text-align: center;
            transition: transform .2s, box-shadow .2s;
        }
        .author-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .author-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #0071e3, #34aadc);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 700; margin: 0 auto 14px;
        }
        .author-name { font-size: .92rem; font-weight: 600; margin-bottom: 4px; }
        .author-books { font-size: .78rem; color: var(--text-tertiary); }

        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 32px 22px; margin-top: 40px;
            text-align: center;
            font-size: .78rem; color: var(--text-tertiary);
        }
        .footer a { color: var(--text-tertiary); text-decoration: none; margin: 0 10px; }
        .footer a:hover { color: var(--text-primary); }

        .sort-row { display: flex; justify-content: flex-end; margin-bottom: 20px; gap: 8px; }
        .sort-btn {
            padding: 6px 14px; border-radius: 100px;
            font-size: .8rem; font-weight: 500;
            text-decoration: none; color: var(--text-secondary);
            border: 1.5px solid var(--border); transition: all .15s;
        }
        .sort-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }
        .sort-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-tertiary); }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-state-title { font-size: 1.2rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

        .page-header { margin-bottom: 1.75rem; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

{% include "catalog/_header.html" %}

{% block content %}{% endblock %}

{% include "catalog/_footer.html" %}

</body>
</html>
